[project]
name = "djx"
version = "0.1.0"
description = "Turn Apple Music favorites into sequenced playlists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
djx = "djx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djx"]
